---
openapi: 3.0.1
info:
  title: RightDocuments API
  version: v1
paths:
  "/api/v1/catalog":
    get:
      summary: Enumerate valid values for entity_type, formation_state, and status
      description: Public catalog of accepted enum values. No authentication required.
      tags:
      - Catalog
      security: []
      responses:
        '200':
          description: success
          content:
            application/json:
              schema:
                type: object
                properties:
                  entity_types:
                    type: array
                    items:
                      type: string
                  formation_states:
                    type: array
                    items:
                      type: string
                  entity_statuses:
                    type: array
                    items:
                      type: string
                  formation_requirements:
                    type: object
                    additionalProperties:
                      type: array
                      items:
                        type: object
                        properties:
                          name:
                            type: string
                          required_tag:
                            type: string
                          description:
                            type: string
  "/api/v1/clients":
    get:
      summary: List the organization's clients
      tags:
      - Clients
      security:
      - bearer: []
      - oauth2:
        - documents:read
      parameters:
      - name: status
        in: query
        required: false
        description: prospective, engaged or concluded
        schema:
          type: string
      - name: client_type
        in: query
        required: false
        description: business or individual
        schema:
          type: string
      responses:
        '200':
          description: clients
    post:
      summary: Create a client
      tags:
      - Clients
      security:
      - bearer: []
      - oauth2:
        - documents:write
      parameters: []
      responses:
        '201':
          description: created as prospective
        '422':
          description: invalid
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '403':
          description: missing documents:write scope
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - client
              properties:
                client:
                  type: object
                  required:
                  - name
                  - client_type
                  - email
                  properties:
                    name:
                      type: string
                    client_type:
                      type: string
                      enum:
                      - business
                      - individual
                    email:
                      type: string
                    phone:
                      type: string
                    address:
                      type: string
                    notes:
                      type: string
                    entity:
                      type: string
                      description: Company UUID or exact name in this organization
  "/api/v1/clients/{id}":
    parameters:
    - name: id
      in: path
      description: Client UUID, number (e.g. 4 or 0004), or exact name
      required: true
      schema:
        type: string
    get:
      summary: Show a client
      tags:
      - Clients
      security:
      - bearer: []
      - oauth2:
        - documents:read
      responses:
        '200':
          description: by name
        '404':
          description: not in this organization
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
    patch:
      summary: Update a client
      tags:
      - Clients
      security:
      - bearer: []
      - oauth2:
        - documents:write
      parameters: []
      responses:
        '200':
          description: admin of the token's organization while the web session is
            in another
        '403':
          description: not an organization admin
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - client
              properties:
                client:
                  type: object
                  properties:
                    name:
                      type: string
                    client_type:
                      type: string
                      enum:
                      - business
                      - individual
                    email:
                      type: string
                    phone:
                      type: string
                    address:
                      type: string
                    notes:
                      type: string
                    status:
                      type: string
                      enum:
                      - prospective
                      - engaged
                      - concluded
                    entity:
                      type: string
                      description: Company UUID or exact name; empty string unlinks
                        it
    delete:
      summary: Delete a client
      tags:
      - Clients
      security:
      - bearer: []
      - oauth2:
        - documents:write
      responses:
        '204':
          description: deleted
        '409':
          description: has matters
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
  "/api/v1/documents/{document_id}/deliveries":
    parameters:
    - name: document_id
      in: path
      required: true
      schema:
        type: string
    get:
      summary: List how a document was sent
      tags:
      - Documents
      security:
      - bearer: []
      - oauth2:
        - documents:read
      responses:
        '200':
          description: deliveries
    post:
      summary: Log a delivery
      tags:
      - Documents
      security:
      - bearer: []
      - oauth2:
        - documents:write
      parameters: []
      responses:
        '201':
          description: logged, recipient from a matter party
        '422':
          description: mail without an address
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '409':
          description: voided document
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - delivery
              properties:
                delivery:
                  type: object
                  required:
                  - channel
                  properties:
                    channel:
                      type: string
                      enum:
                      - email
                      - mail
                      - courier
                      - hand
                      - other
                    provider:
                      type: string
                      enum:
                      - manual
                      - smtp
                      - dhl
                      - fedex
                      - other
                    provider_id:
                      type: string
                    tracking_url:
                      type: string
                    status:
                      type: string
                      enum:
                      - queued
                      - sent
                      - delivered
                      - failed
                      - unknown
                    sent_at:
                      type: string
                      format: date-time
                    delivered_at:
                      type: string
                      format: date-time
                    recipient_name:
                      type: string
                    recipient_email:
                      type: string
                    recipient_address:
                      type: string
                    notes:
                      type: string
                    party_id:
                      type: string
                      description: A party of the document's matter; fills the recipient
  "/api/v1/documents/{document_id}/deliveries/{id}":
    parameters:
    - name: document_id
      in: path
      required: true
      schema:
        type: string
    - name: id
      in: path
      required: true
      schema:
        type: string
    patch:
      summary: Update a delivery (e.g. mark delivered)
      tags:
      - Documents
      security:
      - bearer: []
      - oauth2:
        - documents:write
      parameters: []
      responses:
        '200':
          description: updated
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                delivery:
                  type: object
                  properties:
                    status:
                      type: string
                      enum:
                      - queued
                      - sent
                      - delivered
                      - failed
                      - unknown
                    delivered_at:
                      type: string
                      format: date-time
                    tracking_url:
                      type: string
                    provider_id:
                      type: string
                    notes:
                      type: string
  "/api/v1/documents/{document_id}/deliveries/{id}/sync":
    parameters:
    - name: document_id
      in: path
      required: true
      schema:
        type: string
    - name: id
      in: path
      required: true
      schema:
        type: string
    post:
      summary: Refresh the postal tracking of a mailed letter
      tags:
      - Documents
      security:
      - bearer: []
      - oauth2:
        - documents:write
      responses:
        '200':
          description: refreshed
        '422':
          description: not a letter mailed by the app
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
  "/api/v1/documents/{document_id}/deliveries/mail":
    parameters:
    - name: document_id
      in: path
      required: true
      schema:
        type: string
    post:
      summary: Mail the document to a matter party as a letter (costs postage)
      tags:
      - Documents
      security:
      - bearer: []
      - oauth2:
        - documents:write
      parameters: []
      responses:
        '201':
          description: letter created
        '422':
          description: not confirmed
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - party_id
              - confirm
              properties:
                party_id:
                  type: string
                extra_service:
                  type: string
                  enum:
                  - certified
                  - certified_return_receipt
                confirm:
                  type: boolean
                  description: 'Must be true: this sends a real, paid letter'
  "/api/v1/documents/{id}":
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
    delete:
      summary: Delete a voided document permanently (admins only)
      tags:
      - Documents
      security:
      - bearer: []
      - oauth2:
        - documents:write
      responses:
        '204':
          description: deleted
        '409':
          description: not voided yet
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '403':
          description: not an admin
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '404':
          description: wrong organization
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
    get:
      summary: Show a document
      tags:
      - Documents
      security:
      - bearer: []
      - oauth2:
        - documents:read
      responses:
        '200':
          description: success with download_url
        '404':
          description: wrong organization
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
    patch:
      summary: Update document metadata (tags, name)
      tags:
      - Documents
      security:
      - bearer: []
      - oauth2:
        - documents:write
      parameters: []
      responses:
        '200':
          description: updated
        '403':
          description: missing documents:write scope
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                tag_list:
                  type: string
                  description: Comma-separated tags
                name:
                  type: string
                  description: Display name for imported documents
  "/api/v1/entities/{entity_id}/documents/import":
    parameters:
    - name: entity_id
      in: path
      required: true
      schema:
        type: string
    post:
      summary: Import a PDF as an executed document
      tags:
      - Documents
      security:
      - bearer: []
      - oauth2:
        - documents:write
      parameters: []
      responses:
        '201':
          description: imported
        '403':
          description: missing documents:write scope
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '422':
          description: no file
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: file
        required: true
  "/api/v1/entities/{entity_id}/documents":
    parameters:
    - name: entity_id
      in: path
      required: true
      schema:
        type: string
    get:
      summary: List documents for an entity
      tags:
      - Documents
      security:
      - bearer: []
      - oauth2:
        - documents:read
      responses:
        '200':
          description: success
        '404':
          description: entity in another organization
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
  "/api/v1/documents/{id}/void":
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
    post:
      summary: Void a document (hide it from lists and checklists)
      tags:
      - Documents
      security:
      - bearer: []
      - oauth2:
        - documents:write
      responses:
        '200':
          description: voided
        '403':
          description: missing documents:write scope
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
  "/api/v1/documents/{id}/restore":
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
    post:
      summary: Restore a voided document
      tags:
      - Documents
      security:
      - bearer: []
      - oauth2:
        - documents:write
      responses:
        '200':
          description: restored
  "/api/v1/entities":
    get:
      summary: List entities in the token's organization
      tags:
      - Entities
      security:
      - bearer: []
      - oauth2:
        - documents:read
      responses:
        '200':
          description: success
          content:
            application/json:
              schema:
                type: object
                properties:
                  entities:
                    type: array
                    items:
                      type: object
                      required:
                      - id
                      - name
                      - entity_type
                      - state
                      - status
                      properties:
                        id:
                          type: string
                        name:
                          type: string
                        entity_type:
                          type: string
                        state:
                          type: string
                        status:
                          type: string
                        formation_date:
                          type: string
                          nullable: true
    post:
      summary: Create an entity in the token's organization
      tags:
      - Entities
      security:
      - bearer: []
      - oauth2:
        - documents:write
      parameters: []
      responses:
        '201':
          description: created
        '422':
          description: validation errors
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '403':
          description: missing documents:write scope
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - entity
              properties:
                entity:
                  type: object
                  required:
                  - name
                  - entity_type
                  - formation_state
                  properties:
                    name:
                      type: string
                    entity_type:
                      type: string
                      enum:
                      - C-Corporation
                      - S-Corporation
                      - Limited Liability Company
                      - General Partnership
                      - Limited Partnership
                      - Limited Liability Partnership
                    formation_state:
                      type: string
                      enum:
                      - California
                      - Delaware
                      - Florida
                    status:
                      type: string
                      enum:
                      - Unformed
                      - Incorporation Filed
                      - Incorporation Certified
                      - Operating
                      - Dissolution Filed
                      - Dissolution Certified
                    formation_date:
                      type: string
                      format: date
                      nullable: true
                    ein:
                      type: string
                      nullable: true
                    address:
                      type: string
                      nullable: true
                    phone:
                      type: string
                      nullable: true
  "/api/v1/entities/{id}":
    parameters:
    - name: id
      in: path
      description: Entity UUID
      required: true
      schema:
        type: string
    get:
      summary: Show an entity in the token's organization
      tags:
      - Entities
      security:
      - bearer: []
      - oauth2:
        - documents:read
      responses:
        '200':
          description: success
          content:
            application/json:
              schema:
                type: object
                properties:
                  entity:
                    type: object
                    required:
                    - id
                    - name
                    - entity_type
                    - state
                    - status
                    properties:
                      id:
                        type: string
                      name:
                        type: string
                      entity_type:
                        type: string
                      state:
                        type: string
                      status:
                        type: string
                      formation_date:
                        type: string
                        nullable: true
                      ein:
                        type: string
                        nullable: true
                      duns:
                        type: string
                        nullable: true
                      website_url:
                        type: string
                        nullable: true
                      address:
                        type: string
                        nullable: true
                      county:
                        type: string
                        nullable: true
                      phone:
                        type: string
                        nullable: true
                      file_number:
                        type: string
                        nullable: true
                      fiscal_year_end_month_day:
                        type: string
                        nullable: true
                      shares_authorized:
                        type: integer
                        nullable: true
                      registered_agent_name:
                        type: string
                        nullable: true
                      registered_agent_address:
                        type: string
                        nullable: true
                      incorporator_name:
                        type: string
                        nullable: true
                      incorporator_address:
                        type: string
                        nullable: true
                      incorporator_resigned_on:
                        type: string
                        nullable: true
                      officer_1_name:
                        type: string
                        nullable: true
                      officer_1_title:
                        type: string
                        nullable: true
                      officer_1_email:
                        type: string
                        nullable: true
                      officer_2_name:
                        type: string
                        nullable: true
                      officer_2_title:
                        type: string
                        nullable: true
                      officer_2_email:
                        type: string
                        nullable: true
                      officer_3_name:
                        type: string
                        nullable: true
                      officer_3_title:
                        type: string
                        nullable: true
                      officer_3_email:
                        type: string
                        nullable: true
                      created_at:
                        type: string
                      updated_at:
                        type: string
        '404':
          description: entity belongs to another organization
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '401':
          description: missing token
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
  "/api/v1/matters/{matter_id}/deadlines":
    parameters:
    - name: matter_id
      in: path
      description: Matter UUID or number
      required: true
      schema:
        type: string
    get:
      summary: List a matter's deadlines (by due date)
      tags:
      - Matters
      security:
      - bearer: []
      - oauth2:
        - documents:read
      responses:
        '200':
          description: deadlines
    post:
      summary: Add a deadline
      tags:
      - Matters
      security:
      - bearer: []
      - oauth2:
        - documents:write
      parameters: []
      responses:
        '201':
          description: added
        '422':
          description: missing date
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - deadline
              properties:
                deadline:
                  type: object
                  required:
                  - name
                  - due_on
                  properties:
                    name:
                      type: string
                    due_on:
                      type: string
                      format: date
                    notes:
                      type: string
  "/api/v1/matters/{matter_id}/deadlines/{id}/complete":
    parameters:
    - name: matter_id
      in: path
      required: true
      schema:
        type: string
    - name: id
      in: path
      required: true
      schema:
        type: string
    post:
      summary: Mark a deadline done
      tags:
      - Matters
      security:
      - bearer: []
      - oauth2:
        - documents:write
      responses:
        '200':
          description: done
  "/api/v1/matters/{matter_id}/deadlines/{id}/reopen":
    parameters:
    - name: matter_id
      in: path
      required: true
      schema:
        type: string
    - name: id
      in: path
      required: true
      schema:
        type: string
    post:
      summary: Reopen a deadline
      tags:
      - Matters
      security:
      - bearer: []
      - oauth2:
        - documents:write
      responses:
        '200':
          description: reopened
  "/api/v1/matters/{matter_id}/deadlines/{id}":
    parameters:
    - name: matter_id
      in: path
      required: true
      schema:
        type: string
    - name: id
      in: path
      required: true
      schema:
        type: string
    delete:
      summary: Remove a deadline
      tags:
      - Matters
      security:
      - bearer: []
      - oauth2:
        - documents:write
      responses:
        '204':
          description: removed
  "/api/v1/matters":
    get:
      summary: List matters
      tags:
      - Matters
      security:
      - bearer: []
      - oauth2:
        - documents:read
      parameters:
      - name: status
        in: query
        required: false
        description: open or closed
        schema:
          type: string
      - name: client
        in: query
        required: false
        description: Client UUID or number
        schema:
          type: string
      responses:
        '200':
          description: matters
    post:
      summary: Open a matter for a client
      tags:
      - Matters
      security:
      - bearer: []
      - oauth2:
        - documents:write
      parameters: []
      responses:
        '201':
          description: opened
        '403':
          description: missing documents:write scope
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '404':
          description: client not in this organization
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - matter
              properties:
                matter:
                  type: object
                  required:
                  - client
                  - name
                  properties:
                    client:
                      type: string
                      description: Client UUID or number
                    name:
                      type: string
  "/api/v1/matters/{id}":
    parameters:
    - name: id
      in: path
      description: Matter UUID or number (e.g. 0004-001 or 4-1)
      required: true
      schema:
        type: string
    get:
      summary: Show a matter with its parties
      tags:
      - Matters
      security:
      - bearer: []
      - oauth2:
        - documents:read
      responses:
        '200':
          description: by number
        '404':
          description: unknown number
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
    patch:
      summary: Update a matter's settings
      tags:
      - Matters
      security:
      - bearer: []
      - oauth2:
        - documents:write
      parameters: []
      responses:
        '200':
          description: updated
        '422':
          description: invalid type
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                matter:
                  type: object
                  properties:
                    name:
                      type: string
                    matter_type:
                      type: string
                      enum:
                      - advisory
                      - pre_litigation
                      - litigation
                    our_role:
                      type: string
                      enum:
                      - plaintiff
                      - defendant
                      - claimant
                      - respondent
                      - advisor
                    status:
                      type: string
                      enum:
                      - open
                      - closed
                    opened_on:
                      type: string
                      format: date
                    closed_on:
                      type: string
                      format: date
                    description:
                      type: string
                    outcome:
                      type: string
  "/api/v1/matters/{matter_id}/parties":
    parameters:
    - name: matter_id
      in: path
      description: Matter UUID or number
      required: true
      schema:
        type: string
    get:
      summary: List a matter's parties
      tags:
      - Matters
      security:
      - bearer: []
      - oauth2:
        - documents:read
      responses:
        '200':
          description: parties
    post:
      summary: Add a party to a matter
      tags:
      - Matters
      security:
      - bearer: []
      - oauth2:
        - documents:write
      parameters: []
      responses:
        '201':
          description: added
        '422':
          description: missing name
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - party
              properties:
                party:
                  type: object
                  required:
                  - name
                  - role
                  properties:
                    name:
                      type: string
                    role:
                      type: string
                      enum:
                      - adverse_party
                      - opposing_counsel
                      - co_counsel
                      - court
                      - witness
                      - other
                    email:
                      type: string
                    address:
                      type: string
                    notes:
                      type: string
                    entity_id:
                      type: string
                      description: One of our companies, if the party is one
  "/api/v1/matters/{matter_id}/parties/{id}":
    parameters:
    - name: matter_id
      in: path
      required: true
      schema:
        type: string
    - name: id
      in: path
      required: true
      schema:
        type: string
    delete:
      summary: Remove a party
      tags:
      - Matters
      security:
      - bearer: []
      - oauth2:
        - documents:write
      responses:
        '204':
          description: removed
  "/api/v1/matters/{matter_id}/documents":
    parameters:
    - name: matter_id
      in: path
      required: true
      schema:
        type: string
    get:
      summary: List a matter's documents
      tags:
      - Matters
      security:
      - bearer: []
      - oauth2:
        - documents:read
      responses:
        '200':
          description: documents
  "/api/v1/matters/{matter_id}/documents/import":
    parameters:
    - name: matter_id
      in: path
      required: true
      schema:
        type: string
    post:
      summary: Import a signed PDF under a matter
      tags:
      - Matters
      security:
      - bearer: []
      - oauth2:
        - documents:write
      parameters: []
      responses:
        '201':
          description: imported
        '422':
          description: no file
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: file
        required: true
  "/api/v1/me":
    get:
      summary: Returns the user and the token-bound organization
      tags:
      - Me
      security:
      - bearer: []
      - oauth2:
        - documents:read
      responses:
        '200':
          description: success
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    type: object
                    properties:
                      id:
                        type: string
                      email:
                        type: string
                      name:
                        type: string
                        nullable: true
                  organization:
                    type: object
                    properties:
                      id:
                        type: string
                      name:
                        type: string
                      google_domain:
                        type: string
        '401':
          description: missing token
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
  "/api/v1/templates":
    post:
      summary: Create a template in the token's organization
      tags:
      - Templates
      security:
      - bearer: []
      - oauth2:
        - documents:write
      parameters: []
      responses:
        '201':
          description: created
        '422':
          description: validation errors
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '403':
          description: missing documents:write scope
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - template
              properties:
                template:
                  type: object
                  required:
                  - name
                  - content
                  properties:
                    name:
                      type: string
                    content:
                      type: string
                      description: Markdown content with {{field}} placeholders
                    description:
                      type: string
                      nullable: true
                    public:
                      type: boolean
                      default: false
                    tag_list:
                      type: string
                      description: Comma-separated tags
                      nullable: true
    get:
      summary: List templates visible to the token's organization
      tags:
      - Templates
      security:
      - bearer: []
      - oauth2:
        - documents:read
      responses:
        '200':
          description: success
          content:
            application/json:
              schema:
                type: object
                properties:
                  templates:
                    type: array
                    items:
                      type: object
                      required:
                      - id
                      - name
                      properties:
                        id:
                          type: string
                        name:
                          type: string
                        description:
                          type: string
                          nullable: true
                        tags:
                          type: array
                          items:
                            type: string
  "/api/v1/templates/{id}":
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
    get:
      summary: Show a template with its field definitions
      tags:
      - Templates
      security:
      - bearer: []
      - oauth2:
        - documents:read
      responses:
        '200':
          description: success
          content:
            application/json:
              schema:
                type: object
                properties:
                  template:
                    type: object
                    required:
                    - id
                    - name
                    - fields
                    properties:
                      id:
                        type: string
                      name:
                        type: string
                      description:
                        type: string
                        nullable: true
                      tags:
                        type: array
                        items:
                          type: string
                      fields:
                        type: array
                        items:
                          type: object
                          required:
                          - name
                          - label
                          - type
                          - required
                          - entity_field
                          properties:
                            name:
                              type: string
                            label:
                              type: string
                            type:
                              type: string
                            required:
                              type: boolean
                            default:
                              type: string
                              nullable: true
                            entity_field:
                              type: boolean
        '404':
          description: wrong organization
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
servers:
- url: https://app.rightdocuments.com
- url: http://localhost:3000
security:
- bearer: []
components:
  securitySchemes:
    oauth2:
      type: oauth2
      flows:
        urn:ietf:params:oauth:grant-type:device_code:
          tokenUrl: "/oauth/token"
          scopes:
            documents:read: Read documents and templates
            documents:write: Create/import documents
    bearer:
      type: http
      scheme: bearer
      description: Bearer token obtained via OAuth2 device flow (see oauth2 scheme).
  schemas:
    Error:
      type: object
      required:
      - error
      - message
      - status
      properties:
        error:
          type: string
          example: not_found
        message:
          type: string
        status:
          type: integer
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
